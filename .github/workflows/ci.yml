name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a PR stops the run of the older commit. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm packages
        run: npm ci

      # The TypeScript checks need the route functions that Wayfinder generates.
      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer types:check

      - name: Lint and format (vp check)
        run: npm run check

      - name: TypeScript
        run: npm run types:check

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: event_booking_testing
          POSTGRES_USER: event_booking
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_booking -d event_booking_testing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: event_booking_testing
      DB_USERNAME: event_booking
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      # The pages in the tests load the Vite manifest.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Tests with coverage
        run: vendor/bin/pest --colors=never --coverage-text=coverage.txt

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.txt') != '' }}
        run: |
          {
            echo '## Code coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
